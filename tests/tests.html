<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests appli recettes</title>
<style>body{font:15px/1.4 system-ui;margin:16px;background:#fff;color:#111}.ok{color:#1d5c3f}.ko{color:#b00020;font-weight:700}pre{white-space:pre-wrap}</style>
</head><body>
<h1>Tests</h1><div id="sum"></div><pre id="out"></pre>
<script src="../web/calc.js"></script>
<script src="../web/demo-data.js"></script>
<script>
var out = [], fails = 0, passes = 0;
function ok(cond, label, extra) {
  if (cond) passes++; else fails++;
  out.push((cond ? '✔ ' : '✘ ') + label + (extra !== undefined ? '  → ' + JSON.stringify(extra) : ''));
}
function near(a, b, tol) { return Math.abs(a - b) <= (tol || 1e-6); }
var C = Calc, D = JSON.parse(JSON.stringify(DEMO_DATA)), idx = C.index(D.ingredients);
var ex = D.recipes[0];

/* 1. Recette d'exemple */
var t = C.recipeTotals(ex, idx).portion;
ok(near(t.kcal, 528.75), 'Exemple : 528,75 kcal', t.kcal);
ok(near(t.p, 44.325), 'Exemple : 44,3 g de protéines', t.p);
ok(near(Math.round(t.cost * 100) / 100, 2.11), 'Exemple : 2,11 € par portion', t.cost);
ok(near(t.g, 64.5) && near(t.l, 8.525) && near(t.f, 5.55), 'Exemple : glucides 64,5 / lipides 8,525 / fibres 5,55');

/* 2. Rôles proposés */
var roles = D.ingredients.slice(0, 4).map(C.roleOf);
ok(JSON.stringify(roles) === JSON.stringify(['glucide', 'protéine', 'légume', 'lipide']), 'Rôles par défaut riz/poulet/brocoli/huile', roles);
ok(C.rayonOf(D.ingredients[1]) === 'viandes' && C.rayonOf(D.ingredients[0]) === 'féculents', 'Rayons par défaut');

/* 3. Protéines fixes : 700 kcal */
var a = C.adjust(ex, idx, { kcal: 700, protRef: 45, margin: 0.10 });
var q = {}; a.items.forEach(function (i) { q[i.name] = i.qty; });
ok(a.status === 'ok', 'Ajustement 700 kcal possible', a.status);
ok(near(a.totals.kcal, 700, 1e-6), '700 kcal atteintes', a.totals.kcal);
ok(near(q['Filet de poulet cru'], 150) && near(q['Brocoli cuit'], 150), 'Poulet et brocoli gardés à 150 g');
ok(near(q['Riz basmati cru'] / 75, q["Huile d'olive"] / 5, 1e-9) && q['Riz basmati cru'] > 75, 'Riz et huile ajustés ensemble', q);
ok(a.protStatus === 'ok', 'Protéines dans la marge de 10 %', a.totals.p);

/* 4. Marge 5 % */
var a5 = C.adjust(ex, idx, { kcal: 900, protRef: 45, margin: 0.05 });
ok(a5.protStatus === 'hors' && a5.messages.join(' ').indexOf('hors marge') >= 0, 'Marge 5 % : signalé clairement hors marge à 900 kcal', a5.totals.p);

/* 5. Limite basse et alternatives à 300 kcal */
var lo = C.adjust(ex, idx, { kcal: 250, protRef: 45, margin: 0.10 });
ok(lo.status === 'low', 'Sous la limite basse : avertissement (pas de réduction silencieuse)', lo.status);
ok(near(lo.items.filter(function (i) { return i.name === 'Filet de poulet cru'; })[0].qty, 150), 'Protéines non réduites sous la limite');
var alts = C.alternatives(ex, idx, { kcal: 300, margin: 0.10 });
var none = C.alternatives(ex, idx, { kcal: 200, margin: 0.10 });
ok(none.length === 0, 'Impossible à 200 kcal : aucune fausse alternative', none.length);
ok(alts.length >= 1, 'Au moins une alternative à 300 kcal', alts.map(function (x) { return x.replaced + ' > ' + x.by + ' ' + Math.round(x.byQty) + ' g'; }));
ok(alts.every(function (x) { return Math.abs(x.after.kcal - 300) / 300 <= 0.10 + 1e-9 && Math.abs(x.after.p - t.p) / t.p <= 0.10 + 1e-9; }),
  'Chaque alternative garde protéines et kcal dans la marge');
ok(alts.every(function (x) { return x.before && x.after && 'g' in x.after && 'l' in x.after; }), 'Avant/après fournis (kcal, P, G, L)');
var alts2 = C.alternatives(ex, idx, { kcal: 300, margin: 0.05 });
ok(alts2.every(function (x) { return Math.abs(x.after.kcal - 300) / 300 <= 0.05 + 1e-9; }), 'Alternatives avec marge 5 %', alts2.length);

/* 6. Recette sans glucide ni lipide ajustable */
var pure = { name: 'Poulet seul', portions: 1, lines: [{ ing: 'Filet de poulet cru', qty: 200 }] };
ok(C.adjust(pure, idx, { kcal: 500, margin: .1 }).status === 'impossible', 'Recette non ajustable : signalée impossible');

/* 7. Pesée cru/cuit : 4 tacos, 400 g de viande crue, 300 g cuite */
var tacos = D.recipes[1];
var at = C.adjust(tacos, idx, { kcal: null });
var cp = C.cookPlan(at, 4, { 'Bœuf haché 5 % cru (démo)': 300 });
var beef = cp.filter(function (x) { return x.name.indexOf('Bœuf') === 0; })[0];
ok(near(beef.raw, 400) && near(beef.perPortionCooked, 75), '4 tacos : 400 g cru → 300 g cuit → 75 g par taco', beef);
var tom = cp.filter(function (x) { return x.name.indexOf('Tomate') === 0; })[0];
ok(tom.isRaw && !tom.cooked, 'Aucun coefficient cru/cuit supposé sans pesée');
var at6 = C.adjust(tacos, idx, { kcal: null }); var cp6 = C.cookPlan(at6, 6, {});
ok(near(cp6[0].raw, 600), '6 portions : 600 g de viande crue à peser', cp6[0].raw);

/* 8. Planning en texte libre */
var pl = C.parsePlan('trois soirs poulet-riz, deux soirs tacos, sept midis cabillaud', D.recipes);
var m = {}; pl.items.forEach(function (i) { m[i.recipe] = i.meals; });
ok(m['Poulet riz brocoli (exemple)'] === 3 && m['Tacos bœuf (démo)'] === 2 && m['Cabillaud patate douce (démo)'] === 7, 'Planning dicté reconnu (3, 2, 7)', m);
var pl2 = C.parsePlan('3 poulet riz et 2 tacos\n1 truc inconnu', D.recipes);
ok(pl2.items.length === 2 && pl2.unknown.length === 1, 'Chiffres + « et » + élément inconnu signalé', pl2);

/* 9. Liste de courses */
var stock = { 'Riz basmati cru': 500, "Huile d'olive": 200 };
var L = C.shoppingList([{ recipe: ex.name, meals: 3, kcal: null }, { recipe: 'Cabillaud patate douce (démo)', meals: 2, kcal: null }], D.recipes, idx,
  { protRef: null, margin: .1, stock: stock, useStock: true });
var byN = {}; L.lines.forEach(function (l) { byN[l.name] = l; });
ok(near(byN['Riz basmati cru'].need, 225) && byN['Riz basmati cru'].buy === 0, 'Stock retranché : riz 225 g nécessaires, 500 en stock → 0', byN['Riz basmati cru']);
ok(near(byN['Filet de poulet cru'].buy, 450) && near(byN['Filet de poulet cru'].cost, 4.275), 'Poulet 3 repas : 450 g, 4,28 €', byN['Filet de poulet cru']);
ok(near(byN["Huile d'olive"].need, 15 + 10), 'Ingrédients identiques additionnés (huile 15 + 10 g)', byN["Huile d'olive"].need);
ok(byN['Haricots verts cuits (démo)'].cost === null && L.missingPrice.indexOf('Haricots verts cuits (démo)') >= 0, 'Prix manquant signalé, pas estimé');
var order = L.lines.map(function (l) { return C.RAYONS.indexOf(l.rayon); });
ok(order.every(function (v, i) { return i === 0 || v >= order[i - 1]; }), 'Liste triée par rayon', L.lines.map(function (l) { return l.rayon; }));
var expected = L.lines.reduce(function (s, l) { return s + (l.cost || 0); }, 0);
ok(near(L.total, expected), 'Total de la semaine = somme des lignes', L.total);
var L2 = C.shoppingList([{ recipe: ex.name, meals: 2, kcal: 700 }], D.recipes, idx, { margin: .1, stock: {}, useStock: false });
var rice2 = L2.lines.filter(function (l) { return l.name === 'Riz basmati cru'; })[0];
ok(rice2.need > 150 && near(L2.lines.filter(function (l) { return l.name === 'Filet de poulet cru'; })[0].need, 300), 'Recalcul kcal appliqué avant la liste (riz augmenté, poulet fixe)', rice2.need);

/* 10. Lecture d'étiquette */
var lab = 'Skyr nature\nValeurs nutritionnelles pour 100 g\nÉnergie 263 kJ / 62 kcal\nMatières grasses 0,2 g\ndont acides gras saturés 0,1 g\nGlucides 3,6 g\ndont sucres 3,6 g\nFibres alimentaires 0 g\nProtéines 11 g\nSel 0,1 g';
var n = C.parseNutrition(lab);
ok(n.kcal === 62 && n.p === 11 && n.g === 3.6 && n.l === 0.2 && n.f === 0 && n.name === 'Skyr nature', 'Étiquette lue (62 kcal, P 11, G 3,6, L 0,2, F 0)', n);
var lab2 = 'Pâtes complètes\nPour 100 g\nÉnergie\n1480 kJ\n350 kcal\nMatières grasses\n2,5 g\ndont acides gras saturés\n0,5 g\nGlucides\n64 g\ndont sucres\n3 g\nFibres\n7 g\nProtéines\n13 g';
var n2 = C.parseNutrition(lab2);
ok(n2.kcal === 350 && n2.p === 13 && n2.g === 64 && n2.l === 2.5 && n2.f === 7, 'Étiquette en colonnes (valeur sous le libellé)', n2);
var n3 = C.parseNutrition('Énergie 1500 kJ\nProtéines <0,5 g');
ok(n3.kcal === 359 && n3.p === 0, 'kJ seul → kcal ; « <0,5 » → 0', n3);
ok(C.parsePrice('Prix au kg : 2,15 €').prixKg === 2.15, 'Prix au kg lu');
ok(C.parsePrice('12,90 €/kg').prixKg === 12.9, 'Format 12,90 €/kg');
ok(C.parsePrice('Poulet 500 g 4,75 €').prixKg === 9.5, 'Prix calculé à partir du prix et du poids écrits');
ok(C.parsePrice('Promo !').prixKg === null, 'Pas de prix inventé');

/* 11. Stock dicté */
var ps = C.parseStock('500 g de riz basmati cru, 1 kg de filet de poulet', D.ingredients);
ok(ps.items.length === 2 && ps.items[1].qty === 1000 && ps.items[1].ing === 'Filet de poulet cru', 'Stock dicté reconnu', ps);

/* 12. Objectifs proposés */
var tg = C.targets({ sexe: 'H', annee: 1990, taille: 180, poids: 80, seances: 3, metier: 'assis', objectif: 'Maintien' }, 2026);
ok(tg.kcal === 2360 && tg.prot === 128 && tg.lip === 72 && tg.glu === 300, 'Objectifs : 2 360 kcal, 128 g prot., 72 g lip., 300 g gluc. (H 36 ans 80 kg)', tg);
var tgs = C.targets({ sexe: 'H', annee: 1990, taille: 180, poids: 80, seances: 3, metier: 'assis', objectif: 'Sèche' }, 2026);
ok(tgs.kcal === 1890 && tgs.prot === 160, 'Objectifs sèche : −20 % et 2 g/kg', tgs);
var tgf = C.targets({ sexe: 'F', annee: 1996, taille: 165, poids: 60, seances: 0, metier: 'physique', objectif: 'Masse', protGkg: 1.5 }, 2026);
ok(tgf.prot === 90 && tgf.kcal === Math.round((600 + 1031.25 - 150 - 161) * 1.55 * 1.1 / 10) * 10, 'Objectifs femme, métier physique, masse, protéines g/kg choisies', tgf);
ok(C.targets({ poids: 80 }) === null, 'Objectifs : rien de proposé sans taille/âge');

/* 13. Poids : tendance */
var wt = C.weightTrend([{ date: '2026-10-19', kg: 80 }, { date: '2026-10-21', kg: 80.2 }, { date: '2026-10-27', kg: 80 }, { date: '2026-11-03', kg: 80.1 }], 'Sèche', 2000);
ok(wt.weeks.length === 3 && wt.suggestion && wt.suggestion.delta === -100 && wt.suggestion.kcal === 1900, 'Poids stable en sèche → proposer −100 kcal', wt);
var wt2 = C.weightTrend([{ date: '2026-10-19', kg: 80 }, { date: '2026-10-26', kg: 79.6 }, { date: '2026-11-02', kg: 79.2 }], 'Sèche', 2000);
ok(wt2.suggestion === null, 'Perte de 0,5 %/semaine en sèche → pas d’ajustement', wt2.rate);
ok(C.weightTrend([{ date: '2026-11-02', kg: 80 }], 'Sèche', 2000).suggestion === null, 'Moins de 3 semaines → pas de proposition');

/* 14. Paquets et prix par magasin */
var offers = [{ ing: 'Riz basmati cru', magasin: 'Lidl', pack: 1000, prix: 2.5 }, { ing: 'Riz basmati cru', magasin: 'Leclerc', pack: 500, prix: 1.5 }];
var pl = C.priceLine('Riz basmati cru', 1340, idx.exact['Riz basmati cru'], offers);
ok(pl.packs === 2 && pl.magasin === 'Lidl' && near(pl.cost, 5) && pl.bought === 2000, 'Paquets : 1 340 g → 2 paquets de 1 kg chez Lidl, 5 €', pl);
var pl2 = C.priceLine('Filet de poulet cru', 450, idx.exact['Filet de poulet cru'], offers);
ok(pl2.packs === null && near(pl2.cost, 4.275), 'Sans paquet connu : prix au kg de l’onglet Ingrédients', pl2);
var fl = C.foyerList({ 'Riz basmati cru': 1340, 'Filet de poulet cru': 450 }, idx, { offers: offers, stock: { 'Riz basmati cru': 400 }, useStock: true });
ok(fl.lines[1].buy === 940 && fl.lines[1].packs === 1 && near(fl.total, 2.5 + 4.275), 'Liste du foyer : stock retranché puis paquets', fl);

/* 15. Exclusions, remplacement, semaine automatique */
var idx2 = C.index(D.ingredients.map(function (i) { return i.name === 'Fromage râpé (démo)' ? Object.assign({}, i, { allergenes: 'lactose' }) : i; }));
ok(/Fromage/.test(C.excludedBy(tacos, idx2, { allergies: 'lactose' }) || ''), 'Allergie lactose → tacos exclus');
ok(C.excludedBy(ex, idx2, { allergies: 'lactose' }) === null, 'Allergie lactose → poulet riz gardé');
ok(C.excludedBy(ex, idx2, { exclus: 'Brocoli cuit' }) === 'Brocoli cuit', 'Ingrédient exclu → recette masquée');
var rw = C.replaceWith(ex, idx, { kcal: 528.75, margin: 0.1 }, 'Riz basmati cru', 'Pâtes complètes crues (démo)');
ok(rw && rw.by === 'Pâtes complètes crues (démo)' && Math.abs(rw.after.kcal - 528.75) / 528.75 <= 0.1 && Math.abs(rw.after.p - t.p) / t.p <= 0.1, 'Remplacer le riz par des pâtes : kcal et protéines gardées', rw && rw.after);
var cand = C.replacementCandidates(ex, idx, { kcal: 528.75 }, 'Filet de poulet cru');
ok(cand.length >= 1 && cand.every(function (x) { return C.roleOf(C.find(idx, x.by)) === 'protéine'; }), 'Remplaçants proposés : même rôle (protéine)', cand.map(function (x) { return x.by; }));
var ap = C.autoPlan(D.recipes, { meals: 10, avis: { 'Tacos bœuf (démo)': { fav: true } }, exclude: function (r) { return r.name === 'Cabillaud patate douce (démo)'; }, seed: 3 });
ok(ap.reduce(function (s, x) { return s + x.meals; }, 0) === 10 && ap.every(function (x) { return x.recipe !== 'Cabillaud patate douce (démo)'; }), 'Semaine proposée : 10 repas, recette exclue absente', ap);

/* 16. Ticket de caisse */
var tk0 = C.parseReceipt('LIDL\n12 rue de la Gare\nRIZ BASMATI 1KG 2,49 A\nFILET POULET 500G 5,79 A\n2 x BROCOLI 1KG 3,58 A\nTOMATES 1KG\n1,99 A\nSOUS-TOTAL 13,85\nTOTAL 13,85\nCB 13,85', D.ingredients);
var tki = {}; tk0.items.forEach(function (x) { tki[x.ing || x.label] = x; });
ok(tk0.magasin === 'Lidl' && tk0.items.length === 4, 'Ticket : magasin reconnu, 4 articles, totaux et paiement ignorés', tk0);
ok(tki['Riz basmati cru'] && tki['Riz basmati cru'].prix === 2.49 && tki['Riz basmati cru'].pack === 1000, 'Ticket : riz 1 kg à 2,49 € rapproché de « Riz basmati cru »', tki['Riz basmati cru']);
ok(tki['Filet de poulet cru'] && tki['Filet de poulet cru'].pack === 500, 'Ticket : poulet 500 g reconnu');
var broc = tk0.items.filter(function (x) { return /BROCOLI/.test(x.label); })[0];
ok(broc && broc.prix === 1.79, 'Ticket : « 2 x » → prix unitaire 1,79 €', broc);
ok(tk0.items.some(function (x) { return /TOMATES/.test(x.label) && x.prix === 1.99; }), 'Ticket : prix sur la ligne suivante rattaché à l’article');
ok(C.parseReceipt('TOTAL 12,00\nCB 12,00', D.ingredients).items.length === 0, 'Ticket : aucun prix inventé');

/* 17. Code-barres (Open Food Facts) */
ok(C.validEan('3017620422003') && !C.validEan('3017620422004') && !C.validEan('12345'), 'Code-barres : chiffre de contrôle vérifié');
var off = C.parseOFF({ status: 1, product: { product_name: 'Skyr nature', brands: 'Siggi’s, Autre', quantity: '450 g',
  nutriments: { 'energy-kj_100g': 263, proteins_100g: 11, carbohydrates_100g: 3.6, fat_100g: 0.2 }, allergens_tags: ['en:milk', 'en:unknown'] } });
ok(off && off.kcal === 63 && off.p === 11 && off.g === 3.6 && off.l === 0.2 && off.f === null && off.name === 'Skyr nature – Siggi’s',
  'Code-barres : valeurs pour 100 g reprises, kcal depuis les kJ, fibres absentes non inventées', off);
ok(off.allergenes.join() === 'lactose', 'Code-barres : allergènes traduits (lait → lactose)');
ok(C.parseOFF({ status: 0 }) === null, 'Code-barres : produit inconnu → rien de pré-rempli');

/* ===== Serveur Apps Script simulé ===== */
function runServerTests(code) {
  var writes = [], mails = [];
  function Sheet(name, rows, formulaRows) { this.name = name; this.rows = rows; this.fr = formulaRows || 0; }
  Sheet.prototype.getName = function () { return this.name; };
  Sheet.prototype.getMaxRows = function () { return Math.max(1000, this.rows.length); };
  Sheet.prototype.getMaxColumns = function () { return 26; };
  Sheet.prototype.insertColumnsAfter = function () {};
  Sheet.prototype.getLastRow = function () {
    var last = this.fr;
    for (var i = this.rows.length - 1; i >= 0; i--) if (this.rows[i].some(function (v) { return v !== '' && v != null; })) { last = Math.max(last, i + 1); break; }
    return last;
  };
  Sheet.prototype.cell = function (r, c) { var row = this.rows[r - 1] || []; var v = row[c - 1]; return v === undefined ? '' : v; };
  Sheet.prototype.put = function (r, c, v) {
    while (this.rows.length < r) this.rows.push([]);
    this.rows[r - 1][c - 1] = v; writes.push({ sheet: this.name, r: r, c: c, v: v });
  };
  Sheet.prototype.getRange = function (r, c, nr, nc) {
    var s = this; nr = nr || 1; nc = nc || 1;
    return {
      getValues: function () { var o = []; for (var i = 0; i < nr; i++) { var row = []; for (var j = 0; j < nc; j++) row.push(s.cell(r + i, c + j)); o.push(row); } return o; },
      getValue: function () { return s.cell(r, c); },
      setValues: function (v) { v.forEach(function (row, i) { row.forEach(function (x, j) { s.put(r + i, c + j, x); }); }); return this; },
      setValue: function (v) { s.put(r, c, v); return this; },
      clearContent: function () { for (var i = 0; i < nr; i++) for (var j = 0; j < nc; j++) s.put(r + i, c + j, ''); return this; },
      copyFormatToRange: function () {}, setDataValidation: function () { return this; }, setFontWeight: function () { return this; }
    };
  };
  Sheet.prototype.copyFormatToRange = function () {};
  Sheet.prototype.setFrozenRows = function () {};
  var I = [['Nom']].concat(DEMO_DATA.ingredients.slice(0, 4).map(function (i) { return [i.name, i.etat, i.kcal, i.p, i.g, i.l, i.f, i.prix, i.magasin, i.source, i.remarque]; }));
  var EX = 'Poulet riz brocoli (exemple)';
  var R = [['Nom'], [EX, 1, 'Déjeuner', 'Maintien', 10, 20, 528.75, 44.325, 64.5, 8.525, 5.55, 528.75, 44.325, 64.5, 8.525, 2.11, 2.11, 'Non', 'À tester', 'OK', 'Recette d’exemple']];
  var Lg = [['Recette'], [EX, 'Riz basmati cru', 75], [EX, 'Filet de poulet cru', 150], [EX, 'Brocoli cuit', 150], [EX, "Huile d'olive", 5]];
  var E = [['Recette'], [EX, 1, 'Cuire le riz', 12]];
  var St = [['Ingrédient'], ['Riz basmati cru', 500, '', 'Stock d’exemple']];
  var sheets = { 'Ingrédients': new Sheet('Ingrédients', I, 0), 'Recettes': new Sheet('Recettes', R, 201), 'Lignes_recette': new Sheet('Lignes_recette', Lg, 501),
    'Étapes': new Sheet('Étapes', E, 0), 'Stock cuisine': new Sheet('Stock cuisine', St, 0) };
  var props = {}, cache = {};
  window.SpreadsheetApp = {
    getActive: function () { return { getSheetByName: function (n) { return sheets[n] || null; },
      insertSheet: function (n) { sheets[n] = new Sheet(n, [], 0); return sheets[n]; } }; },
    newDataValidation: function () { var b = { requireValueInList: function () { return b; }, setAllowInvalid: function () { return b; }, build: function () { return {}; } }; return b; },
    getUi: function () { throw new Error('pas d’interface'); }
  };
  window.PropertiesService = { getScriptProperties: function () { return {
    getProperty: function (k) { return k in props ? props[k] : null; }, setProperty: function (k, v) { props[k] = v; } }; } };
  window.CacheService = { getScriptCache: function () { return { get: function (k) { return k in cache ? cache[k] : null; }, put: function (k, v) { cache[k] = v; }, remove: function (k) { delete cache[k]; } }; } };
  window.LockService = { getScriptLock: function () { return { tryLock: function () { return true; }, releaseLock: function () {} }; } };
  window.Utilities = { getUuid: function () { return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); },
    computeHmacSha256Signature: function (s, k) { var h = 0, x = s + '|' + k; for (var i = 0; i < x.length; i++) h = (h * 31 + x.charCodeAt(i)) | 0; return String(h); },
    base64EncodeWebSafe: function (s) { return btoa(String(s)).replace(/\+/g, '-').replace(/\//g, '_'); },
    formatDate: function (d) { return d.toISOString().slice(0, 10); } };
  window.MailApp = { sendEmail: function (o) { mails.push(o); } };
  var fetched = [];
  window.UrlFetchApp = { fetch: function (url) {
    fetched.push(url);
    var world = url.indexOf('world.') >= 0, known = url.indexOf('3017620422003') >= 0;
    return { getResponseCode: function () { return world ? 503 : (known ? 200 : 404); },
      getContentText: function () { return JSON.stringify({ status: 1, product: { product_name: 'Nutella', nutriments: { 'energy-kcal_100g': 539, proteins_100g: 6.3 } } }); } };
  } };
  window.ContentService = { MimeType: { JSON: 'json' }, createTextOutput: function (s) { return { s: s, setMimeType: function () { return this; } }; } };
  window.Session = { getScriptTimeZone: function () { return 'Europe/Paris'; } };
  window.Logger = { log: function () {} };
  var api = new Function(code + '\nreturn { handle_: handle_, doPost: doPost, createAccount_: createAccount_ };')();
  function call(o) { return JSON.parse(api.doPost({ postData: { contents: JSON.stringify(o) } }).s); }
  var WEEK = '2026-11-09';

  /* Connexion */
  ok(call({ action: 'data' }).code === 'NON_CONNECTE', 'Serveur : aucune donnée sans connexion');
  ok(call({ action: 'login', id: 'x', password: 'y' }).code === 'PAS_DE_COMPTE', 'Serveur : aucun compte → message clair');
  api.createAccount_({ id: 'Nacim', name: 'Nacim', role: 'admin', password: 'motdepasse1' });
  api.createAccount_({ id: 'marine', name: 'Marine', role: 'client', password: 'secret-marine', email: 'marine@exemple.fr' });
  var cpt = sheets['Comptes'];
  ok(cpt && cpt.cell(2, 1) === 'nacim' && !!cpt.cell(2, 7) && cpt.rows.every(function (r) { return r.indexOf('motdepasse1') < 0 && r.indexOf('secret-marine') < 0; }),

  ok(call({ action: 'login', id: 'nacim', password: 'faux' }).code === 'MDP_FAUX', 'Serveur : mauvais mot de passe refusé');
  var u = call({ action: 'login', id: ' NACIM ', password: 'motdepasse1' });
  ok(u.ok && u.me.role === 'admin' && u.token.indexOf('motdepasse1') < 0, 'Serveur : connexion admin → jeton', u.me);
  var tk = u.token;
  var d = call({ action: 'data', token: tk });
  ok(d.ok && d.recipes.length === 1 && d.recipes[0].lines.length === 4 && d.ingredients.length === 4 && d.me.id === 'nacim', 'Serveur : lecture du Sheet une fois connecté');
  ok(d.recipes[0].steps[0].timer === 12 && d.stock.length === 1 && d.stock[0].qty === 500, 'Serveur : l’ancien stock (sans foyer) revient à l’admin');
  ok(call({ action: 'check', token: tk + 'x' }).code === 'NON_CONNECTE' && call({ action: 'data', token: tk.replace(/^nacim\|/, 'marine|') }).code === 'NON_CONNECTE', 'Serveur : jeton modifié ou falsifié refusé');
  var cu = call({ action: 'login', id: 'marine@exemple.fr', password: 'secret-marine' });
  var ctk = cu.token;
  ok(cu.ok && cu.me.role === 'client' && cu.me.id === 'marine', 'Serveur : connexion avec l’e-mail');
  ok(call({ action: 'data', token: ctk }).stock.length === 0, 'Serveur : un client ne voit pas le stock de l’admin');
  ok(call({ action: 'addIngredient', token: ctk, ingredient: { name: 'X' } }).code === 'NON_AUTORISE' && call({ action: 'dashboard', token: ctk }).code === 'NON_AUTORISE', 'Serveur : actions admin refusées à un client');
  for (var i = 0; i < 5; i++) call({ action: 'login', id: 'marine', password: 'nope' });
  ok(call({ action: 'login', id: 'marine', password: 'secret-marine' }).code === 'BLOQUE' && call({ action: 'login', id: 'nacim', password: 'motdepasse1' }).ok, 'Serveur : blocage après 5 essais, seulement ce compte');
  cache = {};

  /* Code-barres relayé par le serveur */
  var bc = call({ action: 'barcode', token: tk, code: '3017620422003' });
  ok(bc.ok && bc.json.product.product_name === 'Nutella' && fetched.length === 2, 'Code-barres via le serveur : 2e serveur Open Food Facts si le 1er est en panne', fetched);
  ok(call({ action: 'barcode', token: tk, code: '3017620422003' }).ok && fetched.length === 2, 'Code-barres via le serveur : réponse gardée en cache');
  ok(call({ action: 'barcode', token: tk, code: '3017620422004' }).code === 'VALEUR' && call({ action: 'barcode', code: '3017620422003' }).code === 'NON_CONNECTE', 'Code-barres via le serveur : code faux refusé, connexion exigée');
  ok(call({ action: 'barcode', token: tk, code: '96385074' }).json.status === 0, 'Code-barres via le serveur : produit inconnu signalé');

  /* Inscription */
  var acc = { id: 'paul', name: 'Paul', email: 'Paul@Exemple.fr', password: 'paul-12345', consent: true };
  ok(call({ action: 'signup', account: Object.assign({}, acc, { consent: false }) }).code === 'VALEUR', 'Inscription : confidentialité à accepter');
  ok(call({ action: 'signup', account: Object.assign({}, acc, { name: 'marine' }) }).code === 'DOUBLON', 'Inscription : prénom déjà pris refusé');
  ok(call({ action: 'signup', account: Object.assign({}, acc, { email: 'pas-un-mail' }) }).code === 'VALEUR', 'Inscription : e-mail invalide refusé');
  var su = call({ action: 'signup', account: acc });
  var ptk = su.token;
  ok(su.ok && su.me.role === 'client' && su.me.email === 'paul@exemple.fr', 'Inscription : compte client créé et connecté', su.me);
  ok(call({ action: 'signup', account: Object.assign({}, acc, { id: 'paul2', name: 'Paulo' }) }).code === 'DOUBLON', 'Inscription : e-mail déjà utilisé refusé');
  ok(call({ action: 'setSignup', token: tk, open: false }).ok && call({ action: 'signup', account: { id: 'zoe', name: 'Zoé', email: 'z@e.fr', password: '12345678', consent: true } }).code === 'INSCRIPTION_FERMEE' &&

  call({ action: 'setSignup', token: tk, open: true });

  /* Mot de passe oublié */
  ok(call({ action: 'forgot', email: 'inconnu@exemple.fr' }).sent === true && mails.length === 0, 'Oubli : même réponse pour une adresse inconnue, aucun e-mail');
  ok(call({ action: 'forgot', email: 'paul@exemple.fr' }).sent === true && mails.length === 1 && mails[0].to === 'paul@exemple.fr', 'Oubli : code envoyé par e-mail');
  var codeSent = (mails[0].body.match(/(\d{6})/) || [])[1];
  ok(call({ action: 'resetWithCode', email: 'paul@exemple.fr', code: '000000', password: 'nouveau-paul' }).code === 'CODE_FAUX', 'Oubli : mauvais code refusé');
  var rs = call({ action: 'resetWithCode', email: 'paul@exemple.fr', code: codeSent, password: 'nouveau-paul' });
  ok(rs.ok && rs.token && call({ action: 'data', token: ptk }).code === 'NON_CONNECTE', 'Oubli : nouveau mot de passe, ancienne connexion coupée');
  ptk = rs.token;
  ok(call({ action: 'resetWithCode', email: 'paul@exemple.fr', code: codeSent, password: 'encore-un-autre' }).code === 'CODE_FAUX', 'Oubli : code utilisable une seule fois');

  /* Profil et poids */
  var prof = { kcal: 1800, prot: 120, objectif: 'Sèche', repas: 3, marge: 10, sexe: 'F', annee: 1995, taille: 165, seances: 3, metier: 'assis', protGkg: 2, allergies: ['lactose'], exclus: 'Brocoli cuit' };
  ok(call({ action: 'saveProfile', token: ctk, profile: Object.assign({ name: 'Paul' }, prof) }).ok, 'Profil enregistré');
  var dm = call({ action: 'data', token: ctk });
  ok(dm.profile && dm.profile.name === 'Marine' && dm.profile.kcal === 1800 && dm.profile.allergies === 'lactose' && dm.profile.metier === 'assis', 'Profil : chacun ne modifie que le sien (nom forcé)', dm.profile);
  ok(!('profiles' in dm) && call({ action: 'data', token: tk }).profile === null, 'Profil : personne ne voit les objectifs des autres (pas même l’admin)');
  ok(call({ action: 'addWeight', token: ctk, date: '2026-11-02', kg: 61.5 }).ok && call({ action: 'addWeight', token: ctk, date: '2026-11-02', kg: 61.2 }).ok &&
    call({ action: 'data', token: ctk }).weights.length === 1 && call({ action: 'data', token: ctk }).weights[0].kg === 61.2, 'Poids : une valeur par jour, corrigeable');
  ok(call({ action: 'addWeight', token: ctk, date: '2026-11-02', kg: 9 }).code === 'VALEUR', 'Poids : valeur absurde refusée');

  /* Foyer */
  var cf = call({ action: 'createFoyer', token: ctk, name: 'Coloc' });
  ok(cf.ok && /^[A-Z0-9]{6}$/.test(cf.code), 'Foyer créé avec un code', cf.code);
  ok(call({ action: 'joinFoyer', token: ptk, code: 'ZZZZZZ' }).code === 'INTROUVABLE' && call({ action: 'joinFoyer', token: ptk, code: cf.code.toLowerCase() }).ok, 'Foyer : rejoint par code (majuscules indifférentes)');
  var dp = call({ action: 'data', token: ptk });
  ok(dp.foyer && dp.foyer.name === 'Coloc' && dp.foyer.members.length === 2 && !('kcal' in dp.foyer.members[0]), 'Foyer : membres visibles, sans leurs objectifs', dp.foyer);
  call({ action: 'setStock', token: ctk, items: [{ ing: 'Riz basmati cru', qty: 300 }] });
  ok(call({ action: 'data', token: ptk }).stock[0].qty === 300 && call({ action: 'data', token: tk }).stock[0].qty === 500, 'Stock commun au foyer, séparé de celui de l’admin');

  sheets['Stock cuisine'].rows.push(['Riz basmati cru', 50, '', '', cf.code]); // doublon (ex. saisi à la main)
  call({ action: 'setStock', token: ptk, items: [{ ing: 'Riz basmati cru', qty: 320 }] });
  var rizRows = sheets['Stock cuisine'].rows.filter(function (r) { return r[0] === 'Riz basmati cru' && r[4] === cf.code; });
  ok(rizRows.length === 1 && rizRows[0][1] === 320, 'Stock : une seule ligne par ingrédient (doublon fusionné)', rizRows);
  call({ action: 'setStock', token: ptk, items: [{ ing: 'Riz basmati cru', qty: 300 }] });
  ok(!call({ action: 'data', token: ptk }).token, 'Connexion récente : pas de nouveau jeton');
  var realNow = Date.now; Date.now = function () { return realNow() + 30 * 864e5; };
  var renewed = call({ action: 'data', token: ptk });
  Date.now = function () { return realNow() + 380 * 864e5; };
  var later = call({ action: 'data', token: renewed.token }), old = call({ action: 'data', token: ptk });
  Date.now = realNow;
  ok(renewed.token && renewed.token !== ptk && later.ok && old.code === 'NON_CONNECTE', 'Connexion renouvelée à l’usage : toujours connecté au-delà d’un an (l’ancien jeton, lui, expire)', [later.code, old.code]);

  /* Planning, liste, cuisine */
  ok(call({ action: 'savePlan', token: ctk, week: WEEK, rows: [{ recipe: EX, kcal: 600, id: 'm1' }, { recipe: EX, kcal: 600, day: 'lun', slot: 'soir', id: 'm2' }] }).ok, 'Planning enregistré dans le Sheet');
  ok(call({ action: 'savePlan', token: ctk, week: WEEK, rows: [{ recipe: 'Inconnue' }] }).code === 'INTROUVABLE', 'Planning : recette inconnue refusée');
  call({ action: 'savePlan', token: ptk, week: WEEK, rows: [{ recipe: EX, id: 'p1' }] });
  var fw = call({ action: 'foyerWeek', token: ptk, week: WEEK });
  var mm = fw.meals.filter(function (m) { return m.by === 'marine'; }), pm1 = fw.meals.filter(function (m) { return m.by === 'paul'; })[0];
  var riz = function (m) { return m.items.filter(function (x) { return x.name === 'Riz basmati cru'; })[0].qty; };
  ok(fw.meals.length === 3 && mm.length === 2 && mm[1].day === 'lun' && mm[1].slot === 'soir', 'Semaine du foyer : 3 repas, jour et créneau gardés');
  ok(riz(mm[0]) > 75 && near(riz(pm1), 75) && !JSON.stringify(fw).match(/1800|"prot"/), 'Chaque repas calculé selon les objectifs de son auteur, objectifs non renvoyés', [riz(mm[0]), riz(pm1)]);
  ok(call({ action: 'saveChecks', token: ptk, week: WEEK, checked: ['Riz basmati cru'] }).ok && call({ action: 'data', token: ctk }).checks[WEEK].checked[0] === 'Riz basmati cru', 'Cases cochées partagées dans le foyer');
  ok(call({ action: 'finishShopping', token: ctk, week: WEEK, items: [{ ing: 'Riz basmati cru', qty: 1000 }] }).ok, 'Courses terminées');
  var d3 = call({ action: 'data', token: ptk });
  ok(d3.stock[0].qty === 1300 && d3.checks[WEEK].checked.length === 0 && !!d3.checks[WEEK].done, 'Courses → stock du foyer +1 000 g, cases remises à zéro');
  ok(call({ action: 'cooked', token: ptk, week: WEEK, ids: ['m1', 'm2'], used: [{ ing: 'Riz basmati cru', qty: 150 }], leftovers: { recipe: EX, portions: 1, kcal: 600 } }).marked === 2, 'C’est cuisiné : repas du foyer marqués');
  var fw2 = call({ action: 'foyerWeek', token: ctk, week: WEEK });
  ok(fw2.meals.filter(function (m) { return m.cooked; }).length === 2 && fw2.meals.filter(function (m) { return m.reste; }).length === 1 &&
    call({ action: 'data', token: ctk }).stock[0].qty === 1150, 'Stock −150 g, 1 reste ajouté au planning');
  call({ action: 'savePlan', token: ctk, week: WEEK, rows: [{ recipe: EX, kcal: 600, id: 'm1' }, { recipe: EX, kcal: 600, id: 'm2' }] });
  ok(call({ action: 'foyerWeek', token: ctk, week: WEEK }).meals.filter(function (m) { return m.cooked; }).length === 2, 'Planning ré-enregistré : « cuisiné » conservé');

  /* Avis */
  call({ action: 'setAvis', token: ctk, recipe: EX, avis: { fav: true, note: 4, comment: 'Ajouter du citron' } });
  call({ action: 'setAvis', token: ptk, recipe: EX, avis: { note: 2 } });
  var av = call({ action: 'data', token: ptk });
  ok(av.avis[EX].avg === 3 && av.avis[EX].n === 2 && av.avis[EX].comments[0].name === 'Marine' && !av.myAvis[EX].fav, 'Avis : moyenne, commentaire signé du prénom, favoris personnels', av.avis[EX]);
  ok(call({ action: 'deleteComment', token: ctk, recipe: EX, id: 'marine' }).code === 'NON_AUTORISE' &&
    call({ action: 'deleteComment', token: tk, recipe: EX, id: 'marine' }).ok && call({ action: 'data', token: tk }).avis[EX].comments.length === 0, 'Commentaire supprimé par l’admin seulement');

  /* Propositions */
  var pr = call({ action: 'propose', token: ptk, type: 'recette', title: 'Skyr bowl', data: {
    recipe: { name: 'Skyr bowl', portions: 2, categorie: 'Collation', objectif: 'Sèche', prepa: 5, cuisson: 0, lines: [{ ing: 'Skyr nature', qty: 300 }, { ing: 'Riz basmati cru', qty: 20 }], steps: [{ text: 'Mélanger', timer: null }] },
    ingredients: [{ name: 'Skyr nature', etat: 'Autre', kcal: 62, p: 11, g: 3.6, l: 0.2, f: 0, prix: null, role: 'protéine', rayon: 'épicerie', allergenes: 'lactose' }] } });
  ok(pr.ok && pr.n === 1 && call({ action: 'data', token: ptk }).recipes.length === 1, 'Proposition de recette en attente (pas encore au catalogue)');
  var db = call({ action: 'dashboard', token: tk });
  ok(db.pending.length === 1 && db.users.total === 3 && db.users.foyers === 1 && db.popular[0].planned >= 3, 'Tableau de bord : à valider, utilisateurs, recettes populaires', db.users);
  ok(db.quality.noRole.length === 4 && db.quality.noPhoto.length === 1, 'Tableau de bord : qualité des données');
  writes.length = 0;
  ok(call({ action: 'decide', token: tk, n: 1, accept: true, reply: 'Merci !' }).ok, 'Proposition acceptée');
  ok(sheets['Ingrédients'].cell(6, 1) === 'Skyr nature' && sheets['Ingrédients'].cell(6, 8) === '' && sheets['Ingrédients'].cell(6, 11) === 'Prix manquant' && sheets['Ingrédients'].cell(6, 14) === 'lactose',
    'Nouvel ingrédient écrit ligne 6, prix jamais inventé', sheets['Ingrédients'].rows[5]);
  ok(sheets['Recettes'].cell(3, 1) === 'Skyr bowl' && sheets['Lignes_recette'].cell(6, 2) === 'Skyr nature' && sheets['Lignes_recette'].cell(7, 3) === 20, 'Recette écrite ligne 3, lignes en 6 et 7');
  ok(call({ action: 'data', token: ptk }).myProposals[0].statut === 'acceptée' && call({ action: 'decide', token: tk, n: 1, accept: true }).code === 'DECALE', 'Statut visible par l’auteur, pas de double validation');
  var corrP = call({ action: 'propose', token: ptk, type: 'ingrédient', title: 'Correction : Brocoli cuit', data: { correction: true,
    ingredient: { name: 'Brocoli cuit', etat: 'Cuit', kcal: 34, p: 2.9, g: 4.1, l: 0.4, f: 3.1, prix: 2.5, role: 'légume', rayon: 'légumes' } } });
  writes.length = 0;
  ok(corrP.ok && call({ action: 'decide', token: tk, n: corrP.n, accept: true }).ok && sheets['Ingrédients'].cell(4, 1) === 'Brocoli cuit' &&
    sheets['Ingrédients'].cell(4, 3) === 34 && sheets['Ingrédients'].rows.filter(function (r) { return r[0] === 'Brocoli cuit'; }).length === 1,
    'Correction de macros proposée puis validée : même ligne mise à jour, pas de doublon', sheets['Ingrédients'].rows[3]);
  ok(call({ action: 'propose', token: tk, type: 'ingrédient', title: 'x', data: { correction: true, ingredient: { name: 'Inconnu', kcal: 1, p: 1, g: 1, l: 1 } } }).code === 'INTROUVABLE', 'Correction d’un ingrédient inexistant refusée');
  call({ action: 'propose', token: ptk, type: 'prix', title: 'Riz Lidl', data: { offer: { ing: 'Riz basmati cru', magasin: 'Lidl', pack: 1000, prix: 2.49 } } });
  call({ action: 'propose', token: ptk, type: 'photo', title: 'Photo', data: { recipe: EX, image: 'QUJDRA==' } });
  call({ action: 'decide', token: tk, n: 3, accept: true }); call({ action: 'decide', token: tk, n: 4, accept: true });
  var d4 = call({ action: 'data', token: ctk });
  ok(d4.offers.length === 1 && d4.offers[0].pack === 1000 && d4.photos[0] === EX && call({ action: 'photos', token: ctk, names: [EX] }).photos[EX] === 'QUJDRA==', 'Prix magasin et photo validés');
  ok(sheets['Propositions'].cell(5, 7).indexOf('QUJD') < 0, 'Photo validée : pas gardée en double dans Propositions');
  ok(call({ action: 'propose', token: tk, type: 'prix', title: 'x', data: { offer: { ing: 'Brocoli cuit', magasin: 'Lidl', pack: 450, prix: 1.99 } } }).applied === true, 'Proposition de l’admin appliquée directement');
  ok(call({ action: 'propose', token: tk, type: 'prix', title: 'Ticket', data: { offers: [{ ing: 'Riz basmati cru', magasin: 'Leclerc', pack: 500, prix: 1.6 }, { ing: "Huile d'olive", magasin: 'Leclerc', pack: 1000, prix: 7.9 }] } }).applied &&
    call({ action: 'data', token: tk }).offers.length === 4, 'Ticket de caisse : plusieurs prix en une proposition');
  ok(call({ action: 'addRecipe', token: tk, recipe: { name: 'Bad', portions: 1, lines: [{ ing: 'Inconnu', qty: 1 }] } }).code === 'INTROUVABLE', 'Ingrédient inexact refusé');
  ok(call({ action: 'updateLine', token: tk, row: 3, recipe: EX, ing: 'Filet de poulet cru', qty: 160 }).ok && sheets['Lignes_recette'].cell(3, 3) === 160 &&
    call({ action: 'updateLine', token: tk, row: 4, recipe: EX, ing: 'Filet de poulet cru', qty: 1 }).code === 'DECALE', 'Quantité modifiée, ligne décalée détectée');
  var su2 = call({ action: 'setup', token: tk });
  ok(su2.ok && sheets['Ingrédients'].cell(2, 12) === 'glucide' && sheets['Ingrédients'].cell(6, 12) === 'protéine', 'Rôle/Rayon proposés, valeur saisie gardée');

  /* Suppression de compte */
  ok(call({ action: 'deleteMe', token: ptk, password: 'faux' }).code === 'MDP_FAUX', 'Suppression : mot de passe demandé');
  ok(call({ action: 'deleteMe', token: ptk, password: 'nouveau-paul' }).ok && call({ action: 'login', id: 'paul', password: 'nouveau-paul' }).code === 'MDP_FAUX', 'Suppression : compte supprimé');
  var fw3 = call({ action: 'foyerWeek', token: ctk, week: WEEK });
  ok(fw3.members.length === 1 && fw3.meals.every(function (m) { return m.by === 'marine'; }) && call({ action: 'data', token: tk }).avis[EX].n === 1, 'Suppression : planning et avis de Paul effacés, foyer gardé');
  ok(call({ action: 'deleteMe', token: ctk, password: 'secret-marine' }).ok && call({ action: 'dashboard', token: tk }).users.foyers === 0 &&
    !sheets['Stock cuisine'].rows.some(function (r) { return r[4] === cf.code; }), 'Dernier membre supprimé : foyer et stock effacés');
  ok(call({ action: 'deleteMe', token: tk, password: 'motdepasse1' }).code === 'VALEUR', 'Le seul admin ne peut pas supprimer son compte');

  var forbidden = writes.filter(function (w) {
    return (w.sheet === 'Recettes' && ((w.c >= 7 && w.c <= 17) || w.c === 20)) || (w.sheet === 'Lignes_recette' && w.c >= 4 && w.c <= 9);
  });
  ok(forbidden.length === 0, 'Serveur : AUCUNE écriture dans les colonnes calculées', forbidden);
  ok(writes.every(function (w) { return !(w.sheet === 'Recettes' && w.r === 2); }), 'Serveur : la recette existante n’est jamais écrasée');
}

fetch('../apps-script/Code.gs').then(function (r) { return r.text(); }).then(function (code) {
  try { runServerTests(code); } catch (e) { ok(false, 'Serveur : exception ' + e.message, e.stack); }
}).finally(function () {
  document.getElementById('out').textContent = out.join('\n');
  document.getElementById('sum').innerHTML = '<h2 class="' + (fails ? 'ko' : 'ok') + '">' + passes + ' réussis, ' + fails + ' échoués</h2>';
  window.TEST_RESULT = { passes: passes, fails: fails, out: out };
});
